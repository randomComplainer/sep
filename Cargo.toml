[package]
name = "sep"
version = "0.1.0"
edition = "2024"

[lib]
name = "sep_lib"
path = "src/lib.rs"

[[bin]]
name = "sep-client"
path = "src/bin/client.rs"

[[bin]]
name = "sep-server"
path = "src/bin/server.rs"

[dependencies]
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
http = "1.4.2"
httparse = "1.10.1"
quinn = "0.11.9"
rustls = { version = "0.23.40", default-features = false, features = [ "ring", "std" ] }
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
x509-parser = "0.18.1"
